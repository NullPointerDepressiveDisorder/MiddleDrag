name: Feature Request
description: Suggest a new feature or improvement for MiddleDrag
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We'd love to hear your ideas for making MiddleDrag better.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve, or what workflow would it improve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like MiddleDrag to do.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - Gesture behavior (tap, drag, sensitivity, smoothing)
        - New gesture or input method
        - App-specific compatibility
        - UI / Menu bar
        - Settings / Configuration
        - Other
    validations:
      required: true

  - type: input
    id: app-context
    attributes:
      label: Application Context
      description: If this is related to a specific app, which one?
      placeholder: e.g. Blender, Figma, AutoCAD

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative approaches?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other details, mockups, or references.
